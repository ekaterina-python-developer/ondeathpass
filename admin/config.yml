backend:
  # Вход через GitHub выполняет Cloudflare Worker Sveltia CMS Authenticator.
  name: github
  repo: ekaterina-python-developer/ondeathpass
  branch: main
  # После публикации Worker замените адрес ниже на его URL, например:
  # https://ondeathpass-cms-auth.<your-subdomain>.workers.dev
  base_url: https://REPLACE_WITH_CLOUDFLARE_WORKER_URL.workers.dev

media_folder: "images/news"
public_folder: "images/news"

collections:
  - name: "news"
    label: "Новости"
    files:
      - name: "news_list"
        label: "Список новостей"
        file: "news.json"
        fields:
          - label: "Новости"
            name: "items"
            widget: "list"
            summary: "{{fields.date}} — {{fields.title}}"
            fields:
              - { label: "Дата", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
              - { label: "Заголовок", name: "title", widget: "string" }
              - { label: "Текст", name: "body", widget: "text", required: false }
              - { label: "Картинка", name: "image", widget: "image", required: false }
